[package]
name = "tikray"
version = "0.1.0"
edition = "2024"
description = "View and convert raster and vector images from the terminal, inline in iTerm2"
license = "MIT"

[dependencies]
# Only the two codecs tikray decodes, which is 1.1 MiB smaller than the fifteen
# `default-formats` links (tkr-001 Phase 9).
#
# This does NOT weaken §2.8's "support is an explicit allowlist rather than
# whatever the dependency links in" -- it makes it literally true.
# `src/load.rs:ALLOWED` is what enforces support and always was; fifteen codecs
# were the accident the allowlist was written to survive. A GIF is still refused
# BY NAME here, because `image`'s MAGIC_BYTES table carries no `cfg` and
# `ImageFormat::extensions_str` has no feature gate -- sniffing never needed the
# codec. `rayon` goes too: it is a default feature and tikray parallelises
# nothing.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Pure Rust, so there is no C toolchain step and the binary stays one artifact —
# the deciding reason over librsvg/Cairo (§2.4). `tiny-skia` is deliberately not
# declared here: it arrives through `resvg`, and `src/svg.rs` reaches it as
# `resvg::tiny_skia`. Default features carry `text`, `system-fonts` and
# `memmap-fonts`, which §2.11's `load_system_fonts()` call needs.
resvg = "0.48"
usvg = "0.48"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
# `ratatui-crossterm`'s own `default` feature already selects `crossterm_0_29`,
# so a plain dependency here resolves to the one crossterm instance `src/term.rs`
# already uses -- no explicit feature needed (tkr-001 §2.14).
ratatui = "0.30"
# For the one interruption neither a Drop guard nor a panic hook covers: a real
# `kill -INT` default-terminates without unwinding, so nothing restores the
# terminal. Already in Cargo.lock transitively via crossterm, so this unifies a
# version rather than adding a tree.
signal-hook = "0.3"

[dev-dependencies]
# Integration tests link the library but not its dependencies, so the ones the
# exit gate asserts through have to be named again here.
image = "0.25"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }

# Cargo's default release profile keeps symbols and does not LTO, which nobody
# chose -- it is what an absent [profile.release] gives you. Measured on this
# tree: 11.3 MiB installed, 5.0 MiB with the three lines below, and no behaviour
# change of any kind. `strip` alone accounts for 2.1 MiB of it.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
