[package]
name = "tikray"
version = "0.1.0"
edition = "2024"
description = "View and convert raster and vector images from the terminal, inline in iTerm2"
license = "MIT"

[dependencies]
# Default features are kept deliberately: tkr-001 §2.4/§2.8 build the design around
# `image` decoding more than Tikray supports, with an explicit per-phase allowlist
# deciding what is *supported* rather than what happens to link in.
image = "0.25"
# Pure Rust, so there is no C toolchain step and the binary stays one artifact —
# the deciding reason over librsvg/Cairo (§2.4). `tiny-skia` is deliberately not
# declared here: it arrives through `resvg`, and `src/svg.rs` reaches it as
# `resvg::tiny_skia`. Default features carry `text`, `system-fonts` and
# `memmap-fonts`, which §2.11's `load_system_fonts()` call needs.
resvg = "0.48"
usvg = "0.48"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
# `ratatui-crossterm`'s own `default` feature already selects `crossterm_0_29`,
# so a plain dependency here resolves to the one crossterm instance `src/term.rs`
# already uses -- no explicit feature needed (tkr-001 §2.14).
ratatui = "0.30"
# For the one interruption neither a Drop guard nor a panic hook covers: a real
# `kill -INT` default-terminates without unwinding, so nothing restores the
# terminal. Already in Cargo.lock transitively via crossterm, so this unifies a
# version rather than adding a tree.
signal-hook = "0.3"

[dev-dependencies]
# Integration tests link the library but not its dependencies, so the ones the
# exit gate asserts through have to be named again here.
image = "0.25"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
